<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Entre com a sua conta Google e escolha um número entre 1 e 100. Cada número gera uma figura diferente, assinada com o e-mail da sua conta.</p>
    </header>

    <!-- Google Identity Services. Troque data-client_id pelo seu Client ID (ele é público). -->
    <div id="g_id_onload"
      data-client_id="607253703879-610k8av14f78mi58sl0au1ea5a87oden.apps.googleusercontent.com"
      data-callback="aoEntrar"
      data-auto_prompt="false">
    </div>

    <section id="login">
      <div class="g_id_signin"
        data-type="standard"
        data-theme="filled_black"
        data-size="large"
        data-text="signin_with"
        data-locale="pt-BR">
      </div>
      <p id="usuario"></p>
    </section>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
