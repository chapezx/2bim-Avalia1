name: migrar

on:
  push:
    branches: [main]
    paths: ['migrations/**']

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Aplica as migrações no D1 remoto
        shell: bash
        run: npx --yes wrangler d1 migrations apply desenho-db --remote | tee saida-wrangler.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm install -g @github/copilot

      - name: Monta o prompt do resumo
        run: |
          { echo "Resuma em português, em até 5 itens, o que estas migrações D1 mudaram no banco."
            echo "Saída do wrangler:"
            cat saida-wrangler.txt
            echo '```sql'
            git diff ${{ github.event.before }} ${{ github.sha }} -- migrations/
            echo '```'
          } > prompt-resumo.txt

      - id: resumo
        uses: actions/ai-inference@v3
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt-resumo.txt
          system-prompt: Você resume migrações de banco de dados de forma objetiva.
          model: auto

      - name: Publica o resumo
        if: steps.resumo.outcome == 'success'
        run: |
          echo "## Migrações aplicadas (resumo por IA)" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.resumo.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"